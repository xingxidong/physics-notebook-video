<!doctype html><meta charset="utf-8"><title>可改参数的物理情景</title>
<style>body{max-width:1000px;margin:30px auto;font:17px/1.7 system-ui;color:#253544}canvas{width:100%;background:#fff;border:1px solid #d8dfdf;border-radius:10px}section{margin:28px 0;padding:20px;background:#f5f8f8;border-radius:12px}input{width:65px;margin-right:16px}button{padding:7px 16px}label{display:inline-block}small{color:#566}</style>
<h1>可改参数的物理情景</h1><p>修改后点击“应用参数”。动画、数值和速度箭头一起更新。导出的参数可交给 animation_examples.py 同时重建 TikZ。</p><div id="app"></div><button onclick="download()">保存当前参数</button><p id="error" style="color:#b33"></p>
<script>
let p=__PARAMS__,t0=performance.now();const titles={collision:'一维弹性碰撞',magnetic:'带电粒子的圆周运动',film:'薄膜中的两束反射光'};
const speech={collision:'看碰撞前的两个速度箭头。碰后速度由总动量和总动能共同决定；箭头反向表示速度取负。',magnetic:'速度沿圆弧切线，磁力始终指向圆心。半径由质量、速度、电荷量和磁感应强度共同决定。',film:'先看从上表面直接反射的蓝光路，再看进入薄膜、经下表面反射后出射的绿光路。两束光的光程差还要和反射时的相位变化一起考虑。'};
function setup(){for(const name of Object.keys(p)){let s=document.createElement('section');s.innerHTML='<h2>'+titles[name]+'</h2><div>'+Object.entries(p[name]).map(([k,v])=>'<label>'+k+' <input type="number" step="any" id="'+name+'-'+k+'" value="'+v+'"></label>').join('')+'</div><button onclick="apply()">应用参数</button><canvas id="'+name+'" width="900" height="330"></canvas><p id="'+name+'-value"></p><p>'+speech[name]+'</p>';document.querySelector('#app').append(s)}}
function check(q){let c=q.collision,b=q.magnetic,f=q.film;if(!Object.values(q).every(x=>Object.values(x).every(Number.isFinite)))throw Error('参数需要有限数值');if(c.m1<=0||c.m2<=0||c.u1<=c.u2)throw Error('两质量为正，左物体追向右物体：u1 > u2');if(b.m<=0||b.v<=0||b.q===0||b.B<=0)throw Error('m、v、B 为正，q 非零；图中 B 指向纸内');if(Math.min(f.n0,f.n,f.n2,f.d_nm,f.lambda_nm)<=0||f.theta_deg<0||f.theta_deg>=80||f.n0/f.n*Math.sin(f.theta_deg*Math.PI/180)>=1)throw Error('选择可透射的薄膜参数，入射角在 0 到 80 度之间')}
function apply(){try{let next=JSON.parse(JSON.stringify(p));for(const name in p)for(const k in p[name])next[name][k]=Number(document.getElementById(name+'-'+k).value);check(next);p=next;t0=performance.now();document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='parameters.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),100)}
function context(id){let c=document.getElementById(id).getContext('2d');c.clearRect(0,0,900,330);c.font='20px system-ui';return c}
function line(c,a,b,color='#456',width=2){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
function arrow(c,a,b,color='#1676ad'){let d=[b[0]-a[0],b[1]-a[1]],l=Math.hypot(...d);if(l<.1)return;line(c,a,b,color,3);let u=d.map(x=>x/l);line(c,b,[b[0]-9*u[0]+4*u[1],b[1]-9*u[1]-4*u[0]],color);line(c,b,[b[0]-9*u[0]-4*u[1],b[1]-9*u[1]+4*u[0]],color)}
function point(c,x,y,r,color){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,2*Math.PI);c.fill()}
function label(c,s,x,y){c.fillStyle='#253544';c.fillText(s,x,y)}
function collision(t){let c=context('collision'),a=p.collision,v1=((a.m1-a.m2)*a.u1+2*a.m2*a.u2)/(a.m1+a.m2),v2=(2*a.m1*a.u1+(a.m2-a.m1)*a.u2)/(a.m1+a.m2),s=(t%5)-2.5,k=45/Math.max(1,Math.abs(a.u1),Math.abs(a.u2),Math.abs(v1),Math.abs(v2)),x1=430+(s<0?a.u1:v1)*s*k,x2=454+(s<0?a.u2:v2)*s*k;
line(c,[120,200],[780,200]);point(c,x1,188,12,'#1676ad');point(c,x2,188,12,'#d26b36');label(c,'m₁='+a.m1,x1-25,148);label(c,'m₂='+a.m2,x2-25,115);arrow(c,[x1,230],[x1+(s<0?a.u1:v1)*k,230]);arrow(c,[x2,270],[x2+(s<0?a.u2:v2)*k,270],'#d26b36');label(c,s<0?'碰撞前':'碰撞后',40,45);document.getElementById('collision-value').textContent='v₁='+v1.toFixed(3)+'，v₂='+v2.toFixed(3)+'；质量用 kg，速度用 m/s。';}
function magnetic(t){let c=context('magnetic'),b=p.magnetic,R=b.m*b.v/Math.abs(b.q*b.B),w=b.q*b.B/b.m,sign=Math.sign(w),a=w*t,r=115,O=[430,165],P=[O[0]+sign*r*Math.sin(a),O[1]+sign*r*Math.cos(a)];c.strokeStyle='#bcd';c.beginPath();c.arc(...O,r,0,2*Math.PI);c.stroke();line(c,O,P,'#abc');point(c,...P,6,'#b44');arrow(c,P,[P[0]+55*Math.cos(a),P[1]-55*Math.sin(a)],'#1676ad');arrow(c,P,[P[0]+(O[0]-P[0])*.38,P[1]+(O[1]-P[1])*.38],'#b44');label(c,'B：×（指向纸内）',35,42);label(c,'v：蓝；洛伦兹力：红',35,80);label(c,'O',O[0]+8,O[1]);document.getElementById('magnetic-value').textContent='r='+R.toFixed(3)+' m，角速度大小='+Math.abs(w).toFixed(3)+' rad/s。画面自动适配半径，转向由 q 决定。';}
function film(t){let c=context('film'),f=p.film,theta=f.theta_deg*Math.PI/180,th=Math.asin(f.n0/f.n*Math.sin(theta)),dx=100*Math.tan(th),outside=95*Math.tan(theta),A=[290,130],B=[290+dx,230],C=[290+2*dx,130],I=[290-outside,35],E1=[290+outside,35],E2=[C[0]+outside,35];c.fillStyle='#e7f2f7';c.fillRect(90,130,720,100);line(c,[90,130],[810,130]);line(c,[90,230],[810,230]);arrow(c,I,A,'#bd4d44');arrow(c,A,E1,'#1676ad');arrow(c,A,B,'#3a7852');arrow(c,B,C,'#3a7852');arrow(c,C,E2,'#3a7852');label(c,'n₀='+f.n0,100,80);label(c,'n='+f.n,100,185);label(c,'n₂='+f.n2,100,285);label(c,'d',820,185);
let points=[A,B,C,E2],u=t%3/3*(points.length-1),ix=Math.min(points.length-2,Math.floor(u)),h=u-ix;point(c,points[ix][0]*(1-h)+points[ix+1][0]*h,points[ix][1]*(1-h)+points[ix+1][1]*h,5,'#3a7852');let delta=2*f.n*f.d_nm*Math.cos(th),phase=(Number(f.n2>f.n)-Number(f.n>f.n0))*Math.PI;document.getElementById('film-value').textContent='光程差 2nd cosθt='+delta.toFixed(2)+' nm；反射相位差='+phase/Math.PI+'π；总相位差='+(2*Math.PI*delta/f.lambda_nm+phase).toFixed(3)+' rad。绿点用于指示路径顺序。';}
setup();function loop(now){let t=(now-t0)/1000;collision(t);magnetic(t);film(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
