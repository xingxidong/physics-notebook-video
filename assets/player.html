<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理逐笔板书课</title><style>body{margin:0;background:#e8ede7;color:#304738;font:15px system-ui}main{max-width:1280px;padding:20px;margin:auto}h1{font-size:24px;margin:0 0 12px}canvas{width:100%;border-radius:10px}footer{display:flex;align-items:center;gap:14px;margin:15px 0}button,select{font:inherit;border-radius:7px;border:1px solid #c4d0c3;padding:8px 12px;background:white;color:#345643}button{cursor:pointer}input{flex:1;accent-color:#345643;min-width:70px}#caption{line-height:1.8;min-height:3em;color:#657566}#chapters{display:flex;gap:8px;flex-wrap:wrap}audio{display:none}.draft{color:#a15936}</style><main><h1 id="title"></h1><p id="status"></p><canvas id="board" width="1280" height="720"></canvas><footer><button id="play">播放</button><input id="seek" type="range" min="0" step=".01" value="0"><span id="clock"></span><select id="speed"><option value="0.85">0.85 倍</option><option value="1" selected>1 倍</option><option value="1.15">1.15 倍</option></select></footer><div id="chapters"></div><p id="caption"></p><audio id="voice" src="__AUDIO__" preload="auto"></audio></main>
<script>
__MODELS__
const data=__DATA__,a=document.querySelector('#voice'),c=document.querySelector('#board'),ctx=c.getContext('2d'),s=document.querySelector('#seek'),button=document.querySelector('#play');s.max=data.duration;document.querySelector('#title').textContent=data.title;document.querySelector('#status').textContent=data.draft?'布局预览 · 估算时长 · 暂无配音':'逐笔板书 · 真实配音时间轴 · 可离线播放';if(data.draft)document.querySelector('#status').className='draft';
function portion(p,f){let d=0;for(let i=1;i<p.length;i++)d+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);let rem=d*Math.min(1,Math.max(0,f)),r=[p[0]];for(let i=1;i<p.length;i++){const u=p[i-1],v=p[i],l=Math.hypot(v[0]-u[0],v[1]-u[1]);if(rem>=l){r.push(v);rem-=l}else{const k=l?rem/l:0;r.push([u[0]+k*(v[0]-u[0]),u[1]+k*(v[1]-u[1])]);break}}return r}
const pageImages=new Map();for(const p of data.pages){if(p.image){const im=new Image();im.src=p.image.data;im.onload=()=>renderAt(0);pageImages.set(p.id,im)}}
function paper(p){ctx.fillStyle='#e9ece7';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#fffef9';ctx.beginPath();ctx.roundRect(35,8,1196,692,9);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#e8eeec';ctx.beginPath();for(let x=75;x<1210;x+=26){ctx.moveTo(x,86);ctx.lineTo(x,678)}for(let y=86;y<679;y+=26){ctx.moveTo(64,y);ctx.lineTo(1205,y)}ctx.stroke();ctx.beginPath();ctx.strokeStyle='#e5bdb6';ctx.moveTo(113,86);ctx.lineTo(113,678);ctx.stroke();ctx.font='24px Songti SC,serif';ctx.fillStyle='#344940';if(p.show_title!==false)ctx.fillText(p.title,75,52);ctx.font='16px serif';ctx.fillText(String(p.index+1).padStart(2,'0'),1150,675);if(p.image){const im=pageImages.get(p.id);if(im&&im.complete)ctx.drawImage(im,p.image.x,p.image.y,p.image.w,p.image.h)}}
function renderAt(t){t=Math.max(0,Math.min(data.duration,t));let p=data.pages[0];for(const q of data.pages)if(q.start<=t)p=q;const lt=t-p.start;paper(p);if(p.demonstration)drawDemonstration(p.demonstration,lt);for(const e of p.strokes){if(e.start>lt)break;const f=(lt-e.start)/(e.end-e.start),points=portion(e.points,f);ctx.beginPath();ctx.moveTo(...points[0]);for(const q of points.slice(1))ctx.lineTo(...q);ctx.lineJoin=ctx.lineCap='round';ctx.lineWidth=e.width;ctx.strokeStyle=e.color;ctx.stroke();if(f<1){const q=points.at(-1);ctx.beginPath();ctx.arc(q[0],q[1],5,0,Math.PI*2);ctx.fillStyle='#355c49';ctx.fill()}}const fmt=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');document.querySelector('#clock').textContent=fmt(t)+' / '+fmt(data.duration);const cue=p.cues.find(v=>v.start<=lt&&v.end+v.pause>=lt);document.querySelector('#caption').textContent=cue?cue.text:'';return p.id}
let draftTime=0,draftPlaying=false,last=0;function current(){return data.draft?draftTime:a.currentTime}function seek(t){if(data.draft)draftTime=t;else a.currentTime=t;s.value=t;renderAt(t)}button.onclick=async()=>{if(data.draft){draftPlaying=!draftPlaying;last=performance.now();button.textContent=draftPlaying?'暂停':'播放'}else if(a.paused){if(a.currentTime>=data.duration-.1)seek(0);await a.play();button.textContent='暂停'}else{a.pause();button.textContent='播放'}};s.oninput=()=>seek(Number(s.value));document.querySelector('#speed').onchange=e=>a.playbackRate=Number(e.target.value);for(const p of data.pages){const b=document.createElement('button');b.textContent=(p.index+1)+' '+p.title;b.onclick=()=>seek(p.start);document.querySelector('#chapters').appendChild(b)}a.onended=()=>button.textContent='重播';function tick(now){if(data.draft&&draftPlaying){draftTime=Math.min(data.duration,draftTime+(now-last)/1000*Number(document.querySelector('#speed').value));if(draftTime>=data.duration){draftPlaying=false;button.textContent='重播'}}last=now;if(draftPlaying||!a.paused){s.value=current();renderAt(current())}requestAnimationFrame(tick)}window.renderAt=renderAt;window.seekDemo=t=>{a.pause();draftPlaying=false;seek(t)};renderAt(0);requestAnimationFrame(tick);
</script></html>
